[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-migration-automation"
version = "0.1.0"
description = "Provider-neutral DNS migration planning and automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dnspython>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
gcp = ["google-cloud-dns>=0.36"]
azure = ["azure-identity>=1.17", "azure-mgmt-dns>=8.0"]
tcpwave = ["requests>=2.32"]
all = [
  "boto3>=1.34",
  "google-cloud-dns>=0.36",
  "azure-identity>=1.17",
  "azure-mgmt-dns>=8.0",
  "requests>=2.32",
]

[project.scripts]
dns-migrate = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]